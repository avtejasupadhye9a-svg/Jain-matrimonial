name: Isolated Windows service acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scm:
    runs-on: [self-hosted, Windows, X64, jain-disposable-e]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify disposable runner
        shell: powershell
        run: |
          if ((Get-Location).Drive.Name -ne 'E' -or (Get-Volume -DriveLetter E).FileSystem -ne 'NTFS') {throw 'Prepare an E: NTFS runner workspace.'}
          if (Get-Service JainStorageServer,cloudflared -ErrorAction SilentlyContinue) {throw 'Use a disposable runner without production services.'}
          if ((Get-Service WinDefend).Status -ne 'Running') {throw 'Defender must be running.'}
      - name: Test the origin and real SCM recovery
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          $env:TMP=$env:TEMP=Join-Path $root '.local/tmp'
          $env:PYINSTALLER_CONFIG_DIR=Join-Path $root '.local/pyi'
          $env:PIP_CACHE_DIR=Join-Path $root '.local/pip'
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          py -3.12 -m venv .local/qa-python
          $python=Join-Path $root '.local/qa-python/Scripts/python.exe'
          & $python -m pip install pyinstaller==6.16.0 pywin32==311
          if ($LASTEXITCODE) {throw 'Build dependencies unavailable.'}
          & $python -m unittest discover -s local_storage_service
          if ($LASTEXITCODE) {throw 'Origin regression.'}
          & $python -m PyInstaller --onedir --noconsole --noupx --name QaOrigin --hidden-import win32timezone --paths $root --distpath .local/dist --specpath .local --workpath .local/build scripts/windows/qa_origin.py
          if ($LASTEXITCODE) {throw 'QA build failed.'}
          .\scripts\windows\Test-Scm.ps1 -Fixture (Join-Path $root '.local/dist/QaOrigin')
