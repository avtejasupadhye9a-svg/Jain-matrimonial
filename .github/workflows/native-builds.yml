name: Native builds

on:
  workflow_dispatch:
  push:
    branches:
      - ci/jain-matrimonial-native

permissions:
  contents: read

env:
  FLUTTER_REF: '3.50.0'
  FLUTTER_COMMIT: ab2912035e160d9cad6306df307576da6128ebdb
  CI: 'true'

jobs:
  android:
    name: Android customer APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Flutter and SDK packages
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Analyze, test, and build APK
        working-directory: customer_app
        run: |
          flutter config --no-analytics
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub
          mkdir -p ../native-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk ../native-artifacts/jain-matrimonial-customer.apk
          cd ../native-artifacts
          sha256sum jain-matrimonial-customer.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: apk
        with:
          name: jain-matrimonial-customer-apk
          path: native-artifacts/
          if-no-files-found: error
      - name: Link APK artifact
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '[Download the installable QA APK](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows admin x64
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Flutter
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_REF https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0 -or (git -C $sdk rev-parse HEAD) -ne $env:FLUTTER_COMMIT) {
            throw 'Flutter checkout did not match the configured commit'
          }
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Analyze, test, and build Windows bundle
        working-directory: admin_app
        shell: pwsh
        run: |
          flutter config --no-analytics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($item in 'jain_admin.exe','flutter_windows.dll','data/flutter_assets') {
            if (!(Test-Path (Join-Path $bundle $item))) { throw "Missing runtime item $item" }
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'native-artifacts'
          New-Item -ItemType Directory $output | Out-Null
          $zip = Join-Path $output 'jain-matrimonial-admin-windows-x64.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  jain-matrimonial-admin-windows-x64.zip" | Set-Content (Join-Path $output 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: windows
        with:
          name: jain-matrimonial-admin-windows-x64
          path: native-artifacts/
          if-no-files-found: error
      - name: Link Windows artifact
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.windows.outputs.artifact-url }}
        run: Add-Content $env:GITHUB_STEP_SUMMARY "[Download the Windows admin bundle]($env:ARTIFACT_URL)"
