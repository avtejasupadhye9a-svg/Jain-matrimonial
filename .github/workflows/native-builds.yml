name: Native builds

on:
  workflow_dispatch:
  push:
    branches:
      - ci/jain-matrimonial-native
      - ci/admin-cloudflare

permissions:
  contents: read

env:
  FLUTTER_REF: '3.50.0'
  FLUTTER_COMMIT: ab2912035e160d9cad6306df307576da6128ebdb
  CI: 'true'

jobs:
  android:
    name: Android customer APK
    if: github.ref == 'refs/heads/ci/jain-matrimonial-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Flutter and SDK packages
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Analyze, test, and build APK
        working-directory: customer_app
        run: |
          flutter config --no-analytics
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub
          mkdir -p ../native-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk ../native-artifacts/jain-matrimonial-customer.apk
          cd ../native-artifacts
          sha256sum jain-matrimonial-customer.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: apk
        with:
          name: jain-matrimonial-customer-apk
          path: native-artifacts/
          if-no-files-found: error
      - name: Link APK artifact
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '[Download the installable QA APK](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows admin x64
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Flutter
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_REF https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0 -or (git -C $sdk rev-parse HEAD) -ne $env:FLUTTER_COMMIT) {
            throw 'Flutter checkout did not match the configured commit'
          }
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Analyze, test, and build Windows bundle
        working-directory: admin_app
        shell: pwsh
        run: |
          flutter config --no-analytics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
          foreach ($item in 'jain_admin.exe','flutter_windows.dll','data/app.so','data/icudtl.dat','data/flutter_assets','flutter_secure_storage_windows_plugin.dll','file_selector_windows_plugin.dll') {
            if (!(Test-Path (Join-Path $bundle $item))) { throw "Missing runtime item $item" }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest -property installationPath
          if (!$vs) { throw 'Visual C++ runtime not found on the runner' }
          $crt = Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Recurse -File -Filter 'msvcp140.dll' |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC[0-9]+\.CRT\\msvcp140\.dll$' } |
            Sort-Object { [version]::new($_.VersionInfo.FileMajorPart, $_.VersionInfo.FileMinorPart, $_.VersionInfo.FileBuildPart, $_.VersionInfo.FilePrivatePart) } -Descending |
            Select-Object -First 1
          if (!$crt) { throw 'Visual C++ x64 runtime files not found' }
          Copy-Item (Join-Path $crt.DirectoryName '*.dll') $bundle
          foreach ($item in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (!(Test-Path (Join-Path $bundle $item))) { throw "Missing Visual C++ runtime $item" }
          }
          $app = Start-Process -FilePath (Join-Path $bundle 'jain_admin.exe') -WorkingDirectory $bundle -WindowStyle Hidden -PassThru
          try {
            if ($app.WaitForExit(8000)) { throw "Admin exited at startup with code $($app.ExitCode)" }
          } finally {
            if (!$app.HasExited) { Stop-Process -InputObject $app }
          }
          $output = Join-Path $env:GITHUB_WORKSPACE 'native-artifacts'
          New-Item -ItemType Directory $output | Out-Null
          $zip = Join-Path $output 'jain-matrimonial-admin-windows-x64.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $files = @($archive.Entries | Where-Object Length -gt 0 |
              ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($item in 'jain_admin.exe','flutter_windows.dll','data/app.so','data/icudtl.dat','flutter_secure_storage_windows_plugin.dll','file_selector_windows_plugin.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
              if ($item -cnotin $files) { throw "ZIP missing $item" }
            }
            if (!($files -clike 'data/flutter_assets/*')) { throw 'ZIP missing Flutter assets' }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  jain-matrimonial-admin-windows-x64.zip" | Set-Content (Join-Path $output 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: windows
        with:
          name: jain-matrimonial-admin-windows-x64
          path: |
            native-artifacts/jain-matrimonial-admin-windows-x64.zip
            native-artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Link Windows artifact
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.windows.outputs.artifact-url }}
        run: Add-Content $env:GITHUB_STEP_SUMMARY "[Download the Windows admin bundle]($env:ARTIFACT_URL)"
